apiVersion: apps/v1
kind: Deployment
metadata:
  name: httpbin-v1
  namespace: pedro
  labels:
    app: httpbin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: httpbin
  template:
    metadata:
      labels:
        app: httpbin
    spec:
      containers:
        - name: httpbin
          image: docker.io/kennethreitz/httpbin
          ports:
            - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: httpbin
  namespace: pedro
  labels:
    app: httpbin
spec:
  ports:
    - port: 80
      name: http
  selector:
    app: httpbin
